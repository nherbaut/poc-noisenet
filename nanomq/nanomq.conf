# Both listeners accept connections on all container interfaces.
listeners.tcp {
    bind = "0.0.0.0:1883"
}

listeners.ws {
    bind = "0.0.0.0:8083/mqtt"
}

# Development broker: no authentication or TLS.
auth {
    allow_anonymous = true
    no_match = allow
}

log {
    to = [console]
    level = info
}
